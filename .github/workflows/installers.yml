name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x64
          - os: windows-2025
            platform: Windows-x64
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r packaging/requirements.txt
      - run: python -B -m unittest test_planner test_server test_processing
      - run: python packaging/build.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libx11-xcb1 libfontconfig1 libdbus-1-3
          xvfb-run -a python packaging/selftest.py
      - if: runner.os != 'Linux'
        run: python packaging/selftest.py
      - if: runner.os == 'Linux'
        run: python packaging/linux.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          New-Item -ItemType Directory -Force release
          Copy-Item packaging/release/* release/
      - if: runner.os == 'macOS'
        run: |
          mkdir -p release build/dmg
          cp -R dist/OpenDronePlanner.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname OpenDronePlanner -srcfolder build/dmg -ov -format UDZO release/OpenDronePlanner-${{ matrix.platform }}.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenDronePlanner-${{ matrix.platform }}
          path: release/*
          retention-days: 14
